<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>205chating</title><link rel="stylesheet" href="style.css"><script src="/socket.io/socket.io.js"></script></head><body>
<div id="auth" class="auth"><form id="authForm" class="auth-card"><div class="brand">205chating</div><h1 id="authTitle">Вход</h1><label>Username / telephone number<input id="login" autocomplete="username" required></label><label id="usernameWrap" class="hidden">Username<input id="username"></label><label>Password<input id="password" type="password" minlength="6" required></label><button class="primary" type="submit">Продолжить</button><button id="toggleAuth" class="link" type="button">Создать аккаунт</button><div id="authError" class="error"></div></form></div>
<div id="app" class="app hidden">
<aside class="sidebar"><div class="side-top"><div class="brand small">205chating</div><button id="addContact" class="icon-btn">＋</button></div><button class="chat-item active" data-chat="global"><span class="chat-avatar">205</span><span><b>205chat</b><small id="participants">— участников</small></span></button><div class="section-title">Личные сообщения</div><div id="contacts"></div><div class="side-bottom"><button id="openProfile">Профиль</button><button id="openSettings">Настройки</button><button id="adminBtn" class="hidden">Админ</button></div></aside>
<main class="chat"><header><button id="mobileBack" class="mobile-only icon-btn">☰</button><div><h2 id="chatTitle">205chat</h2><div id="chatSubtitle">— участников</div></div><div id="typing"></div></header><div id="pinned" class="pinned hidden"></div><section id="messages" class="messages"></section>
<div id="replyBar" class="reply-bar hidden"><span id="replyText"></span><button id="cancelReply">×</button></div><div id="uploadPreview" class="upload-preview hidden"></div>
<footer class="composer"><input id="mediaInput" type="file" accept="image/*,video/*" hidden><button id="attachBtn" class="composer-btn">＋</button><textarea id="messageInput" rows="1" placeholder="Сообщение"></textarea><button id="voiceBtn" class="composer-btn mic">🎙</button><button id="send" class="send-btn">➤</button></footer><div id="recordingBar" class="recording hidden"><span id="recordLabel">Запись голосового</span><b id="recordTime">00:00</b><button id="stopRecord">■</button></div><div id="videoPreview" class="video-preview hidden"><video id="videoCam" autoplay muted playsinline></video><div><b id="videoTime">00:00</b><button id="stopVideo">■</button></div></div></main>
</div>
<div id="menu" class="menu hidden"></div>
<div id="reactionPicker" class="reaction-picker hidden"></div>
<div id="contactModal" class="modal hidden"><div class="modal-card"><h3>Добавить контакт</h3><p>Введите номер телефона или @username</p><input id="contactQuery" placeholder="+7... или @username"><div class="modal-actions"><button data-close="contactModal">Отмена</button><button id="saveContact" class="primary">Добавить</button></div></div></div>
<div id="profileModal" class="modal hidden"><div class="modal-card"><h3>Профиль</h3><div id="profileAvatar" class="profile-avatar"></div><input id="avatarInput" type="file" accept="image/*"><div id="profilePhone" class="muted"></div><input id="profileUsername"><button id="saveUsername" class="primary">Сохранить username</button><button data-close="profileModal">Закрыть</button></div></div>
<div id="settingsModal" class="modal hidden"><div class="modal-card"><h3>Настройки</h3><div class="setting-row"><span>Тема</span><button id="toggleTheme">Сменить</button></div><button data-close="settingsModal">Закрыть</button></div></div>
<div id="adminModal" class="modal hidden"><div class="modal-card wide"><h3>Панель администратора</h3><div id="usersTable"></div><button data-close="adminModal">Закрыть</button></div></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script></body></html>
